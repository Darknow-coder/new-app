<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Marbl — the daily tilt puzzle</title>
    <meta name="description" content="Tilt the board, roll the marbles, drop them in their holes. Three new puzzles every day. Free, no ads, works offline." />
    <meta name="theme-color" content="#11142b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)" />
    <meta property="og:title" content="Marbl — the daily tilt puzzle" />
    <meta property="og:description" content="Tilt. Roll. Drop. Three new marble puzzles every day. Can you match par?" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://darknow-coder.github.io/new-app/" />
    <meta property="og:image" content="https://darknow-coder.github.io/new-app/icons/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7L4.5 11.5 9 16M5 11.5h9.5a5 5 0 010 10H12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3M4.5 4v4.5H9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-hint" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0012 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-stats" viewBox="0 0 24 24"><path d="M5 20V12M12 20V5M19 20v-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
        <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.6 9.3a2.5 2.5 0 014.8.9c0 1.7-2.4 2-2.4 3.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.2" fill="currentColor"/></symbol>
        <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.3" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="8" cy="17" r="2.3" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
        <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8M5 12.5V19a1.5 1.5 0 001.5 1.5h11A1.5 1.5 0 0019 19v-6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2.5c.6 3.2 5.5 5.6 5.5 11a5.5 5.5 0 01-11 0c0-2.6 1.4-4.2 2.5-5.3.2 1.6.9 2.7 2 3.2C11 8.5 11 5.5 12 2.5z" fill="currentColor"/></symbol>
        <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2l-5.7 3.1 1.2-6.4-4.7-4.4 6.4-.8z" fill="currentColor"/></symbol>
        <symbol id="i-infinity" viewBox="0 0 24 24"><path d="M7 8.5c-2 0-3.5 1.6-3.5 3.5S5 15.5 7 15.5c3.5 0 6.5-7 10-7 2 0 3.5 1.6 3.5 3.5s-1.5 3.5-3.5 3.5c-3.5 0-6.5-7-10-7z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
        <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffc23d"/><circle cx="12" cy="12" r="10" fill="none" stroke="#d48a0c" stroke-width="1.6"/><circle cx="12" cy="12" r="6.2" fill="none" stroke="#e39b12" stroke-width="1.6"/><path d="M8.2 7.6a5.4 5.4 0 013.8-1.6" fill="none" stroke="#fff3cf" stroke-width="1.6" stroke-linecap="round"/></symbol>
        <symbol id="i-rewind" viewBox="0 0 24 24"><path d="M11 6L4.5 12 11 18zM19.5 6L13 12l6.5 6z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></symbol>
        <symbol id="i-gift" viewBox="0 0 24 24"><path d="M4 10h16v3H4zM5.5 13h13v7.5h-13zM12 10v10.5M12 10c-1.5-3.5-6-4.5-6-1.8C6 10 9.5 10 12 10zm0 0c1.5-3.5 6-4.5 6-1.8 0 1.8-3.5 1.8-6 1.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5" fill="currentColor"/><path d="M8 10.5V8a4 4 0 018 0v2.5" fill="none" stroke="currentColor" stroke-width="2.2"/></symbol>
        <symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4M6 4.5c4-2 7 2 12 0v8c-5 2-8-2-12 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="currentColor"/></symbol>
      </defs>
    </svg>

    <div class="splash" id="splash" aria-hidden="true">
      <div class="splash-logo">
        <span class="splash-marbles"><i class="lm lm-1"></i><i class="lm lm-2"></i><i class="lm lm-3"></i></span>
        <span class="splash-word"><b>m</b><b>a</b><b>r</b><b>b</b><b>l</b></span>
        <span class="splash-tag" data-i18n="tagline"></span>
      </div>
    </div>

    <div id="app">
      <!-- HOME -->
      <section class="view view-home is-active" id="view-home" aria-labelledby="home-title">
        <div class="scenery" id="scenery-home" aria-hidden="true"></div>
        <header class="topbar">
          <div class="brand">
            <span class="logo" aria-hidden="true"><i class="lm lm-1"></i><i class="lm lm-2"></i><i class="lm lm-3"></i></span>
            <h1 id="home-title" class="wordmark">marbl</h1>
          </div>
          <div class="topbar-actions">
            <button class="coin-pill" data-shop data-i18n-label="shop"><svg><use href="#i-coin"/></svg><b data-coins>0</b></button>
            <button class="icon-btn" id="btn-help" data-i18n-label="howTo"><svg><use href="#i-help"/></svg></button>
            <button class="icon-btn" id="btn-stats" data-i18n-label="stats"><svg><use href="#i-stats"/></svg></button>
            <button class="icon-btn" id="btn-settings" data-i18n-label="settings"><svg><use href="#i-settings"/></svg></button>
          </div>
        </header>

        <main class="home-main">
          <div class="player-strip">
            <button class="player-badge" id="player-badge" type="button"><span id="player-level">1</span></button>
            <div class="xp">
              <div class="xp-top"><strong id="player-title"></strong><small id="player-xp"></small></div>
              <div class="xp-bar"><i id="xp-fill"></i></div>
            </div>
            <button class="inbox-btn" id="inbox-btn" type="button" hidden><span class="mini-chest" id="inbox-chest"></span><b id="inbox-count"></b></button>
          </div>

          <div class="hero">
            <p class="eyebrow" id="home-date"></p>
            <h2 class="hero-title"><span data-i18n="todayTitle"></span> <span class="hero-num" id="home-num"></span></h2>
            <div class="chip-row">
              <button class="streak-chip" id="streak-chip" type="button"><svg><use href="#i-flame"/></svg><span id="streak-text"></span></button>
              <button class="gift-chip" id="gift-chip" type="button" hidden><svg><use href="#i-gift"/></svg><span id="gift-text"></span></button>
              <button class="gift-chip chest-chip" id="daily-chest-chip" type="button" hidden><span class="mini-chest" id="daily-chest-mini"></span><span data-i18n="dailyChest"></span></button>
            </div>
          </div>

          <button class="endless-card adventure-hero" id="btn-adventure">
            <span class="endless-icon"><svg><use href="#i-flag"/></svg></span>
            <span class="endless-text">
              <strong data-i18n="adventure"></strong>
              <small id="adventure-desc"></small>
              <span class="adv-progress"><i id="adventure-bar"></i></span>
              <span class="adv-chests" id="adv-chests" hidden></span>
            </span>
            <span class="endless-go"><svg><use href="#i-play"/></svg></span>
          </button>

          <ol class="daily-list" id="daily-list"></ol>

          <div class="share-row" id="share-row" hidden>
            <button class="btn btn-primary btn-wide" id="btn-share-day"><svg><use href="#i-share"/></svg><span data-i18n="shareDay"></span></button>
          </div>
          <p class="countdown" id="countdown"></p>

          <section class="quests-card" aria-labelledby="quests-title">
            <header class="quests-head">
              <strong id="quests-title" data-i18n="quests"></strong>
              <span class="quests-bonus" id="quests-bonus"></span>
            </header>
            <ul class="quest-list" id="quest-list"></ul>
          </section>

          <div class="meta-row">
            <button class="meta-tile" id="btn-collection">
              <span class="collection-balls" id="collection-balls"></span>
              <strong data-i18n="collection"></strong>
              <small id="collection-desc"></small>
            </button>
            <button class="meta-tile" id="btn-achievements">
              <span class="ach-icon"><svg><use href="#i-star"/></svg><b class="badge" id="ach-badge" hidden></b></span>
              <strong data-i18n="achievements"></strong>
              <small id="ach-desc"></small>
            </button>
          </div>
          <p class="footer-note" data-i18n="footer"></p>
        </main>
      </section>

      <!-- ADVENTURE MAP -->
      <section class="view view-map" id="view-map" aria-labelledby="map-title">
        <div class="scenery" id="scenery-map" aria-hidden="true"></div>
        <header class="topbar">
          <button class="icon-btn" id="btn-map-back" data-i18n-label="back"><svg><use href="#i-back"/></svg></button>
          <div class="game-title"><strong id="map-title" data-i18n="adventure"></strong><small id="map-sub"></small></div>
          <button class="coin-pill" data-shop data-i18n-label="shop"><svg><use href="#i-coin"/></svg><b data-coins>0</b></button>
        </header>
        <div class="map-scroll" id="map-scroll"><div class="map" id="map"></div></div>
        <button class="map-recenter" id="map-recenter" hidden><svg class="mr-arrow"><use href="#i-back"/></svg><span id="map-recenter-n"></span></button>
      </section>

      <!-- GAME -->
      <section class="view view-game" id="view-game" aria-label="Puzzle">
        <div class="scenery" id="scenery-game" aria-hidden="true"></div>
        <header class="topbar game-topbar">
          <button class="icon-btn" id="btn-back" data-i18n-label="back"><svg><use href="#i-back"/></svg></button>
          <div class="game-title">
            <strong id="game-title"></strong>
            <small id="game-sub"></small>
          </div>
          <div class="counter" id="counter" aria-live="off">
            <span class="counter-moves"><b id="moves-num">0</b><small data-i18n="moves"></small></span>
            <span class="counter-par" id="par-num"></span>
          </div>
        </header>

        <div class="tip" id="tip" hidden></div>

        <div class="board-area" id="board-area">
          <div class="board-stage">
            <div class="board" id="board" role="application" aria-roledescription="puzzle board" tabindex="0">
              <div class="board-floor" id="board-floor"></div>
              <div class="board-layer" id="board-layer"></div>
              <div class="level-banner" id="level-banner" aria-hidden="true"><strong></strong><small></small></div>
              <div class="combo" id="combo" aria-hidden="true"><strong></strong><small></small></div>
              <div class="hint-arrow" id="hint-arrow" hidden><svg viewBox="0 0 24 24"><path d="M12 4v16M5 11l7-7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            </div>
          </div>
        </div>

        <footer class="controls">
          <button class="ctrl" id="btn-undo"><svg><use href="#i-undo"/></svg><span data-i18n="undo"></span></button>
          <button class="ctrl" id="btn-restart"><svg><use href="#i-restart"/></svg><span data-i18n="restart"></span></button>
          <button class="ctrl ctrl-boost" id="btn-rewind" hidden><svg><use href="#i-rewind"/></svg><span data-i18n="rewindName"></span><b class="badge" id="rewind-count"></b></button>
          <button class="ctrl ctrl-boost" id="btn-hint" hidden><svg><use href="#i-hint"/></svg><span data-i18n="hint"></span><b class="badge" id="hint-count"></b></button>
        </footer>
      </section>
    </div>

    <!-- MODALS -->
    <dialog class="modal" id="modal-result">
      <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
      <div class="modal-card result-card">
        <div class="result-rays" id="result-rays" aria-hidden="true"></div>
        <span class="new-best" id="new-best" hidden data-i18n="newBest"></span>
        <div class="result-stars" id="result-stars"></div>
        <h2 id="result-title"></h2>
        <p class="result-line" id="result-line"></p>
        <div class="result-xp" id="result-xp" hidden><span id="result-xp-text"></span><div class="xp-bar"><i id="result-xp-fill"></i></div><em id="result-levelup" hidden></em></div>
        <p class="result-reward" id="result-reward" hidden><svg><use href="#i-coin"/></svg><span></span></p>
        <p class="result-sub" id="result-sub"></p>
        <div class="modal-actions" id="result-actions"></div>
      </div>
    </dialog>

    <dialog class="modal" id="modal-help">
      <div class="modal-card">
        <button class="icon-btn modal-close" data-close data-i18n-label="back"><svg><use href="#i-close"/></svg></button>
        <h2 data-i18n="howTo"></h2>
        <div class="help-demo" aria-hidden="true">
          <div class="demo-board">
            <i class="demo-hole"></i><i class="demo-wall"></i><i class="demo-marble"></i>
          </div>
        </div>
        <ul class="help-list">
          <li data-i18n="help1"></li>
          <li data-i18n="help2"></li>
          <li data-i18n="help3"></li>
          <li data-i18n="help4"></li>
          <li data-i18n="help5"></li>
          <li data-i18n="help6"></li>
          <li data-i18n="help7"></li>
        </ul>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="btn-replay-tutorial" data-i18n="replayTutorial"></button>
          <button class="btn btn-primary" data-close data-i18n="letsGo"></button>
        </div>
      </div>
    </dialog>

    <dialog class="modal" id="modal-stats">
      <div class="modal-card">
        <button class="icon-btn modal-close" data-close data-i18n-label="back"><svg><use href="#i-close"/></svg></button>
        <h2 data-i18n="stats"></h2>
        <div class="stats-grid" id="stats-grid"></div>
        <h3 class="mini-title" data-i18n="last7"></h3>
        <div class="week" id="stats-week"></div>
      </div>
    </dialog>

    <dialog class="modal" id="modal-shop">
      <div class="modal-card">
        <button class="icon-btn modal-close" data-close data-i18n-label="back"><svg><use href="#i-close"/></svg></button>
        <h2 data-i18n="shop"></h2>
        <div class="shop-balance"><svg><use href="#i-coin"/></svg><b data-coins>0</b></div>
        <p class="shop-sub" data-i18n="shopSub"></p>
        <div class="shop-list" id="shop-list"></div>
      </div>
    </dialog>

    <dialog class="modal" id="modal-achievements">
      <div class="modal-card">
        <button class="icon-btn modal-close" data-close data-i18n-label="back"><svg><use href="#i-close"/></svg></button>
        <h2 data-i18n="achievements"></h2>
        <ul class="ach-list" id="ach-list"></ul>
      </div>
    </dialog>

    <dialog class="modal" id="modal-level">
      <div class="modal-card level-card">
        <button class="icon-btn modal-close" data-close data-i18n-label="back"><svg><use href="#i-close"/></svg></button>
        <small class="lp-world" id="lp-world"></small>
        <h2 id="lp-title"></h2>
        <div class="lp-stars" id="lp-stars"></div>
        <p class="lp-best" id="lp-best"></p>
        <div class="lp-chips" id="lp-chips"></div>
        <div class="modal-actions"><button class="btn btn-primary btn-full lp-play" id="lp-play"><svg><use href="#i-play"/></svg><span data-i18n="play"></span></button></div>
      </div>
    </dialog>

    <dialog class="modal" id="modal-mech">
      <div class="modal-card mech-card">
        <span class="mech-badge" data-i18n="newMechanic"></span>
        <div class="mech-art" id="mech-art"></div>
        <h2 id="mech-title"></h2>
        <p class="mech-desc" id="mech-desc"></p>
        <div class="modal-actions"><button class="btn btn-primary btn-full" data-close data-i18n="gotIt"></button></div>
      </div>
    </dialog>

    <dialog class="modal" id="modal-collection">
      <div class="modal-card">
        <button class="icon-btn modal-close" data-close data-i18n-label="back"><svg><use href="#i-close"/></svg></button>
        <h2 data-i18n="collection"></h2>
        <p class="shop-sub" data-i18n="collectionSub"></p>
        <div class="skin-grid" id="skin-grid"></div>
      </div>
    </dialog>

    <dialog class="modal" id="modal-chest-preview">
      <div class="modal-card preview-card">
        <button class="icon-btn modal-close" data-close data-i18n-label="back"><svg><use href="#i-close"/></svg></button>
        <div class="preview-chest" id="preview-chest"></div>
        <h2 id="preview-title"></h2>
        <div class="preview-progress"><i id="preview-bar"></i><span id="preview-count"></span></div>
        <h3 class="mini-title" data-i18n="chestContents"></h3>
        <ul class="preview-list" id="preview-list"></ul>
        <div class="modal-actions"><button class="btn btn-primary btn-full" id="preview-action"></button></div>
      </div>
    </dialog>

    <dialog class="modal" id="modal-settings">
      <div class="modal-card">
        <button class="icon-btn modal-close" data-close data-i18n-label="back"><svg><use href="#i-close"/></svg></button>
        <h2 data-i18n="settings"></h2>
        <label class="toggle"><span data-i18n="sound"></span><input type="checkbox" id="set-sound" /><i></i></label>
        <label class="toggle"><span data-i18n="music"></span><input type="checkbox" id="set-music" /><i></i></label>
        <label class="toggle"><span data-i18n="haptics"></span><input type="checkbox" id="set-haptics" /><i></i></label>
        <button class="btn btn-ghost btn-wide" id="btn-install" hidden data-i18n="install"></button>
        <button class="btn btn-danger-ghost btn-wide" id="btn-reset" data-i18n="resetData"></button>
      </div>
    </dialog>

    <dialog class="chest-modal" id="modal-chest">
      <div class="chest-stage" id="chest-stage">
        <div class="chest-rays" aria-hidden="true"></div>
        <div class="chest-motes" aria-hidden="true"><i style="--x:0%;--d:0.00s;--s:0.60"></i><i style="--x:37%;--d:0.37s;--s:0.93"></i><i style="--x:74%;--d:0.74s;--s:1.27"></i><i style="--x:11%;--d:1.11s;--s:0.77"></i><i style="--x:48%;--d:1.48s;--s:1.10"></i><i style="--x:85%;--d:1.85s;--s:0.60"></i><i style="--x:22%;--d:2.22s;--s:0.93"></i><i style="--x:59%;--d:2.59s;--s:1.27"></i><i style="--x:96%;--d:2.96s;--s:0.77"></i><i style="--x:33%;--d:0.33s;--s:1.10"></i><i style="--x:70%;--d:0.70s;--s:0.60"></i><i style="--x:7%;--d:1.07s;--s:0.93"></i><i style="--x:44%;--d:1.44s;--s:1.27"></i><i style="--x:81%;--d:1.81s;--s:0.77"></i><i style="--x:18%;--d:2.18s;--s:1.10"></i><i style="--x:55%;--d:2.55s;--s:0.60"></i></div>
        <div class="chest-top"><span class="coin-pill chest-coins"><svg><use href="#i-coin"/></svg><b id="chest-balance">0</b></span></div>
        <p class="chest-title" id="chest-title"></p>
        <div class="chest-light" aria-hidden="true"><i class="cl-glow"></i><i class="cl-rays"></i><i class="cl-beam"></i><i class="cl-beam cl-beam2"></i></div>
        <div class="chest-wrap" id="chest-wrap"></div>
        <div class="chest-upgrade" id="chest-upgrade" data-i18n="upgraded"></div>
        <p class="chest-tap" data-i18n="tapToOpen"></p>
        <div class="chest-taps" id="chest-taps"></div>
        <div class="chest-rewards" id="chest-rewards"></div>
        <button class="btn btn-primary chest-collect" id="chest-collect" hidden data-i18n="collect"></button>
        <div class="chest-flash" id="chest-flash" aria-hidden="true"></div>
      </div>
    </dialog>

    <div class="iris" id="iris" aria-hidden="true"></div>
    <div class="notif" id="notif" popover="manual" aria-live="polite"><span class="notif-icon" id="notif-icon"></span><span class="notif-text"><strong id="notif-title"></strong><small id="notif-sub"></small></span></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="sr-only" id="sr-live" aria-live="polite"></div>
